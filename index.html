<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>AI Tracker</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,sans-serif}
#app{position:fixed;inset:0;background:#000}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
canvas{pointer-events:none}
.top{position:absolute;z-index:5;top:max(14px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between}
.badge{background:#000b;padding:8px 11px;border-radius:20px;font-weight:800;font-size:12px;backdrop-filter:blur(8px)}
.actions{position:absolute;z-index:5;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
button{border:0;color:#fff;background:#000b;border-radius:50%;width:52px;height:52px;font-weight:800;backdrop-filter:blur(8px)}
button.on{background:#ec4899}
button:disabled{opacity:.4}
#start{position:absolute;z-index:6;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);border-radius:28px;width:auto;height:auto;padding:14px 24px;background:#ec4899;font-size:15px}
#hint{position:absolute;z-index:5;left:50%;top:72%;transform:translate(-50%,-50%);background:#000b;padding:10px 14px;border-radius:16px;text-align:center;font-size:13px;max-width:84%}
#panel{position:absolute;z-index:7;left:12px;right:12px;bottom:12px;background:#000d;border-radius:16px;padding:12px;display:none}
#panel.show{display:block}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
#panel button{width:auto;height:38px;border-radius:10px;background:#333}
input{width:100%}
#error{color:#ff8c8c;font-size:12px;margin-top:6px;word-break:break-word}
#permission{position:absolute;z-index:10;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.card{max-width:360px;background:#151515;border-radius:22px;padding:24px}
.card button{width:auto;height:auto;border-radius:12px;padding:13px 20px;background:#ec4899}
.hide{display:none!important}
#logs{position:absolute;z-index:4;left:12px;top:58px;max-width:62%;max-height:100px;overflow:auto;background:#0009;padding:7px;border-radius:10px;font-size:10px}
</style>
</head>
<body>
<div id="app">
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>

<div class="top">
  <span class="badge">AI TRACKER</span>
  <span id="status" class="badge">Kamera OFF</span>
</div>

<div class="actions">
  <button id="switch" disabled aria-label="Ganti kamera">↻</button>
  <button id="flash" disabled aria-label="Flash">⚡</button>
  <button id="ai" disabled aria-label="AI">AI</button>
  <button id="panelBtn" aria-label="Pengaturan">⚙</button>
</div>

<button id="start">Buka Kamera</button>
<div id="hint">Tekan Buka Kamera</div>
<div id="logs">Belum ada deteksi</div>

<div id="panel">
  <div class="row">
    <button id="load">Muat Model AI</button>
    <button id="export">CSV</button>
  </div>
  <label>
    Confidence <b id="confText">50%</b>
    <input id="conf" type="range" min="20" max="90" value="50">
  </label>
  <div id="error"></div>
</div>

<div id="permission">
  <div class="card">
    <h2>Akses Kamera</h2>
    <p>Izinkan akses kamera untuk menggunakan AI Object Tracker.</p>
    <button id="allow" type="button">Izinkan Kamera</button>
    <p id="perr"></p>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<script>
"use strict";

const $ = id => document.getElementById(id);
const v = $("video");
const c = $("canvas");
const ctx = c.getContext("2d");

const targets = [
  "mouse",
  "keyboard",
  "cell phone",
  "book",
  "scissors",
  "laptop",
  "person"
];

const names = {
  mouse: "Mouse",
  keyboard: "Keyboard",
  "cell phone": "HP",
  book: "Buku",
  scissors: "Gunting",
  laptop: "Laptop",
  person: "Orang"
};

let stream = null;
let model = null;
let facing = "environment";
let ai = false;
let busy = false;
let detecting = false;
let conf = 0.50;
let lastSave = 0;
let logs = [];

function ui(){
  $("status").textContent =
    stream ? (ai ? "AI ON" : "Kamera ON") : "Kamera OFF";

  $("ai").classList.toggle("on", ai);
  $("switch").disabled = !stream;
  $("flash").disabled = !stream;
  $("ai").disabled = !stream || !model;
  $("start").classList.toggle("hide", !!stream);
}

function message(text, error=false){
  $("hint").textContent = text;
  $("error").textContent = error ? text : "";
  console.log("[AI Tracker]", text);
}

function showPermissionError(text){
  $("perr").textContent = text;
  $("error").textContent = text;
}

function isSecure(){
  return window.isSecureContext ||
    location.hostname === "localhost" ||
    location.hostname === "127.0.0.1";
}

/* ================= CAMERA ================= */

async function requestCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showPermissionError("Browser tidak mendukung akses kamera. Gunakan Chrome, Edge, Firefox, atau Safari versi terbaru.");
    return false;
  }

  if(!isSecure()){
    showPermissionError("Kamera web membutuhkan HTTPS atau localhost.");
    return false;
  }

  try{
    const test = await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:false
    });

    test.getTracks().forEach(track => track.stop());
    return true;

  }catch(e){
    console.error("Permission:", e);

    let text = "Kamera tidak dapat diakses.";

    if(e.name === "NotAllowedError"){
      text = "Izin kamera ditolak. Izinkan kamera untuk situs ini di pengaturan browser.";
    }else if(e.name === "NotFoundError"){
      text = "Kamera tidak ditemukan.";
    }else if(e.name === "NotReadableError"){
      text = "Kamera sedang digunakan aplikasi lain.";
    }else if(e.name === "SecurityError"){
      text = "Browser memblokir akses kamera.";
    }

    showPermissionError(text + " (" + e.name + ")");
    return false;
  }
}

async function openCamera(){

  const allowed = await requestCamera();
  if(!allowed) return;

  if(stream){
    stream.getTracks().forEach(t => t.stop());
  }

  ai = false;
  detecting = false;

  try{

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:facing},
        width:{ideal:640},
        height:{ideal:480}
      },
      audio:false
    });

    v.srcObject = stream;
    v.muted = true;
    v.setAttribute("playsinline","");
    await v.play();

    await new Promise(resolve => {
      if(v.readyState >= 2){
        resolve();
      }else{
        v.addEventListener("loadedmetadata", resolve, {once:true});
      }
    });

    c.width = v.videoWidth || 640;
    c.height = v.videoHeight || 480;

    $("permission").classList.add("hide");

    message(
      "Kamera siap. Resolusi " +
      c.width + "×" + c.height +
      "."
    );

    ui();

  }catch(e){

    console.error("Camera:", e);

    stream = null;
    v.srcObject = null;
    ui();

    showPermissionError(
      "Gagal membuka kamera: " +
      (e.message || e.name)
    );

  }
}

/* ================= AI MODEL ================= */

async function loadModel(){

  if(model) return true;

  $("load").disabled = true;
  $("load").textContent = "Memuat...";
  message("Menyiapkan TensorFlow...");

  try{

    await tf.ready();

    /*
      Gunakan WebGL jika tersedia.
      Jika gagal, fallback ke CPU.
    */
    try{
      await tf.setBackend("webgl");
      await tf.ready();
    }catch(e){
      console.warn("WebGL tidak tersedia:", e);
      await tf.setBackend("cpu");
      await tf.ready();
    }

    message(
      "Backend AI: " +
      tf.getBackend() +
      ". Mengunduh model..."
    );

    model = await cocoSsd.load({
      base:"lite_mobilenet_v2"
    });

    if(stream && v.readyState >= 2){
      await model.detect(v);
    }

    $("load").textContent = "AI Siap";
    $("load").disabled = false;
    ui();

    message(
      "AI siap menggunakan " +
      tf.getBackend() +
      ". Tekan AI."
    );

    return true;

  }catch(e){

    console.error("Model:",e);

    model = null;
    $("load").disabled = false;
    $("load").textContent = "Muat Model AI";

    message(
      "Model gagal dimuat: " +
      (e.message || e),
      true
    );

    return false;
  }
}

/* ================= DETECTION ================= */

async function toggleAI(){

  if(!stream){
    await openCamera();
    if(!stream) return;
  }

  if(!model){
    const ok = await loadModel();
    if(!ok) return;
  }

  ai = !ai;
  detecting = ai;

  ui();

  if(ai){
    message("AI aktif. Mencari objek...");
    detect();
  }else{
    message("AI dimatikan.");
    ctx.clearRect(0,0,c.width,c.height);
  }
}

function draw(predictions){

  ctx.clearRect(0,0,c.width,c.height);

  if(!v.videoWidth || !v.videoHeight) return;

  const sx = c.width / v.videoWidth;
  const sy = c.height / v.videoHeight;

  for(const p of predictions){

    if(!targets.includes(p.class)) continue;
    if(p.score < conf) continue;

    const [x,y,w,h] = p.bbox;

    const bx = x * sx;
    const by = y * sy;
    const bw = w * sx;
    const bh = h * sy;

    ctx.strokeStyle = "#ec4899";
    ctx.lineWidth = 4;
    ctx.strokeRect(bx,by,bw,bh);

    const label =
      (names[p.class] || p.class) +
      " " +
      Math.round(p.score * 100) +
      "%";

    ctx.font = "bold 15px system-ui";

    const width =
      ctx.measureText(label).width + 14;

    const ly = Math.max(by - 26,0);

    ctx.fillStyle = "#ec4899";
    ctx.fillRect(bx,ly,width,26);

    ctx.fillStyle = "#fff";
    ctx.fillText(label,bx+7,ly+18);
  }
}

async function detect(){

  if(!detecting || !stream || !model) return;

  if(!busy && v.readyState >= 2){

    busy = true;

    try{

      const predictions =
        await model.detect(v);

      console.log("Predictions:",predictions);

      draw(predictions);

      const detected =
        predictions.filter(p =>
          targets.includes(p.class) &&
          p.score >= conf
        );

      if(detected.length){

        const text = detected.map(p =>
          (names[p.class] || p.class) +
          " " +
          Math.round(p.score * 100) +
          "%"
        ).join(", ");

        message(
          detected.length +
          " objek: " +
          text
        );

        save(detected);

      }else{

        message("AI aktif — belum menemukan objek.");
      }

    }catch(e){

      console.error("Detection:",e);

      message(
        "Deteksi error: " +
        (e.message || e),
        true
      );

    }finally{

      busy = false;
    }
  }

  setTimeout(detect,300);
}

/* ================= LOG ================= */

function save(items){

  const now = Date.now();

  if(now-lastSave < 2500) return;

  lastSave = now;

  const line =
    new Date().toLocaleTimeString("id-ID") +
    " — " +
    items.map(p =>
      (names[p.class] || p.class) +
      " " +
      Math.round(p.score*100) +
      "%"
    ).join(", ");

  logs.unshift(line);
  logs = logs.slice(0,8);

  $("logs").innerHTML =
    logs.join("<br>");
}

/* ================= CONTROLS ================= */

$("allow").addEventListener("click",openCamera);
$("start").addEventListener("click",openCamera);
$("ai").addEventListener("click",toggleAI);
$("load").addEventListener("click",loadModel);

$("panelBtn").addEventListener("click",() => {
  $("panel").classList.toggle("show");
});

$("conf").addEventListener("input",e => {
  conf = Number(e.target.value)/100;
  $("confText").textContent =
    e.target.value + "%";
});

$("switch").addEventListener("click",async() => {
  facing =
    facing === "environment"
      ? "user"
      : "environment";

  await openCamera();
});

$("flash").addEventListener("click",async() => {

  const track =
    stream?.getVideoTracks()[0];

  const cap =
    track?.getCapabilities?.();

  if(!cap?.torch){
    message(
      "Flash/torch tidak didukung kamera ini.",
      true
    );
    return;
  }

  try{

    const on = !track._torch;
    track._torch = on;

    await track.applyConstraints({
      advanced:[{torch:on}]
    });

    $("flash").classList.toggle("on",on);

  }catch(e){

    message(
      "Flash tidak dapat diaktifkan.",
      true
    );
  }
});

$("export").addEventListener("click",() => {

  if(!logs.length) return;

  const csv =
    "Waktu,Deteksi\n" +
    logs.map(x => `"${x}"`).join("\n");

  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(
      new Blob([csv],{type:"text/csv"})
    );

  a.download = "detection-log.csv";
  a.click();
});

ui();
</script>
</body>
</html>
